; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = SolarArrayMainFrame

[env:BuoyMainFrame]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<BuoyMainFrame/*>

[env:CannisterMainFrame]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<CannisterMainFrame/*>
lib_deps = seeed-studio/Grove barometer HP20x@^1.0.0

[env:SolarArrayMainFrame]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<SolarArrayMainFrame/*>
